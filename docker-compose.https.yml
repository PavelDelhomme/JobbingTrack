services:
  dev-https-proxy:
    image: nginx:1.27-alpine
    container_name: jobbingtrack-dev-https-proxy
    profiles:
      - https
      - full
    ports:
      - "${DEV_HTTPS_PORT:-5443}:443"
    volumes:
      - ./production/nginx/dev-https/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/dev-certs/jobbingtrack-dev.pem:/etc/nginx/certs/jobbingtrack-dev.pem:ro
      - ./.local/dev-certs/jobbingtrack-dev-key.pem:/etc/nginx/certs/jobbingtrack-dev-key.pem:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate https://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
