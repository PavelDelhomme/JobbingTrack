services:
  dev-https-proxy:
    image: nginx:1.27-alpine
    container_name: jobbingtrack-dev-https-proxy
    profiles:
      - https
    ports:
      - "${DEV_HTTPS_PORT:-5443}:443"
      - "${DEV_HTTPS_STANDARD_PORT:-443}:443"
      - "${DEV_HTTPS_HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - ./production/nginx/dev-https/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./production/nginx/dev-https/errors:/etc/nginx/__jt_err__:ro
      - ./.local/dev-certs/jobbingtrack-dev-fullchain.pem:/etc/nginx/certs/jobbingtrack-dev-fullchain.pem:ro
      - ./.local/dev-certs/jobbingtrack-dev-key.pem:/etc/nginx/certs/jobbingtrack-dev-key.pem:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - jobbingtrack-network
    healthcheck:
      # Joignabilité réelle des upstreams (127.0.0.1 ne matche pas server_name TLS ; /health n’existait pas sur Nginx → faux positifs).
      test: ["CMD-SHELL", "wget -qO- http://frontend:3000/health >/dev/null 2>&1 && wget -qO- http://api-gateway:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
