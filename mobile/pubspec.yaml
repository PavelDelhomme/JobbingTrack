name: jobbingtrack_mobile
description: Application mobile Flutter pour JobbingTrack

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.1.3
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  url_launcher: ^6.2.2
  flutter_local_notifications: ^16.3.2
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  dio: ^5.3.3
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  fluttertoast: ^8.2.4
  flutter_localizations:
    sdk: flutter
  # Mobile specific
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0
  share_plus: ^7.2.2
  file_picker: ^6.1.1
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
