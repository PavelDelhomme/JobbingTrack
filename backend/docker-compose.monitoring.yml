version: '3.8'

services:
  # ============================================
  # COLLECTE DES MÉTRIQUES CONTENEURS
  # ============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: jobbingtrack-cadvisor-monitor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - monitoring

  # ============================================
  # COLLECTE DES LOGS CONTENEURS
  # ============================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: jobbingtrack-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - monitoring

  # ============================================
  # STOCKAGE MÉTRIQUES (avec rétention 90 jours)
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: jobbingtrack-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring

  # ============================================
  # STOCKAGE LOGS (avec rétention 30 jours)
  # ============================================
  loki:
    image: grafana/loki:2.9.3
    container_name: jobbingtrack-loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - monitoring

  # ============================================
  # AGGREGATEUR SÉCURISÉ (API Node.js)
  # ============================================
  metrics-aggregator-api:
    build:
      context: ./monitoring/metrics-aggregator
      dockerfile: Dockerfile
    container_name: jobbingtrack-metrics-api
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - NODE_ENV=production
      - PORT=3015
    ports:
      - "3015:3015"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - monitoring
      - jobbingtrack-network

  # ============================================
  # VISUALISATION (Optionnel pour debug)
  # ============================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: jobbingtrack-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
  jobbingtrack-network:
    external: true
