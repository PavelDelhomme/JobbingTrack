  # Service de gestion des profils et CVs
  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-profile-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=development
      - PORT=3009
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
