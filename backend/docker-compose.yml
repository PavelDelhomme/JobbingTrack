services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-postgres
    environment:
      POSTGRES_DB: jobbingtrack
      POSTGRES_USER: jobbingtrack
      POSTGRES_PASSWORD: jobbingtrack123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack -d jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis
    ports:
      - "6379:6379"
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service de statistiques Docker
  docker-stats-service:
    build:
      context: ./docker-stats-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-docker-stats
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=development
      - PORT=3015
    volumes:
      # ✅ Monter le socket Docker pour accéder aux statistiques
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jobbingtrack-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: jobbingtrack-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DOCKER_STATS_SERVICE_URL=http://docker-stats-service:3015
      - AUTH_SERVICE_URL=http://auth-service:3001
      - APPLICATION_SERVICE_URL=http://application-service:3002
      - COMPANY_SERVICE_URL=http://company-service:3003
      - CONTACT_SERVICE_URL=http://contact-service:3004
      - INTERVIEW_SERVICE_URL=http://interview-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - DASHBOARD_SERVICE_URL=http://dashboard-service:3007
      - CALL_SERVICE_URL=http://call-service:3008
      - PROFILE_SERVICE_URL=http://profile-service:3009
      - EVENT_SERVICE_URL=http://event-service:3011
      - FOLLOWUP_SERVICE_URL=http://followup-service:3012
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8081,http://localhost:8080
      - JWT_SECRET=your-secret-key-change-in-production-2025
    volumes:
      # ✅ Monter le docker-compose.yml pour pouvoir redémarrer les services
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    depends_on:
      - docker-stats-service
      - auth-service
      - application-service
      - company-service
      - contact-service
      - interview-service
      - notification-service
      - dashboard-service
      - call-service
      - profile-service
      - event-service
      - followup-service
    networks:
      - jobbingtrack-network

  # Service d'authentification
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - JWT_REFRESH_SECRET=your-refresh-secret-change-too-2025
      - SMTP_HOST=smtp.ovh.net
      - SMTP_PORT=587
      - SMTP_USER=candidatures@delhomme.ovh
      - SMTP_PASS=V**Uw61^3*bz5c2AFrx&2d&%
      - SMTP_FROM=JobbingTrack <candidatures@delhomme.ovh>
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # Service des candidatures
  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-application-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des entreprises
  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-company-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des contacts
  contact-service:
    build:
      context: ./contact-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-contact-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des entretiens
  interview-service:
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-interview-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des notifications
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-notification-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - SMTP_HOST=smtp.ovh.net
      - SMTP_PORT=587
      - SMTP_USER=candidatures@delhomme.ovh
      - SMTP_PASS=V**Uw61^3*bz5c2AFrx&2d&%
      - SMTP_FROM=JobbingTrack <candidatures@delhomme.ovh>
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # Service du dashboard
  dashboard-service:
    build:
      context: ./dashboard-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-dashboard-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des appels téléphoniques
  call-service:
    build:
      context: ./call-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-call-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service dédié aux relances
  followup-service:
    build:
      context: ./followup-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-followup-service
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=development
      - PORT=3012
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
  
  # Gestion du calendrier et disponibilités
  # calendar-service:
  #   build:
  #     context: ./calendar-service
  #     dockerfile: Dockerfile
  #   container_name: jobbingtrack-calendar-service
