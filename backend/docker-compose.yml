  # Service des entretiens
  interview-service:
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-interview-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des notifications
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-notification-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - SMTP_HOST=smtp.ovh.net
      - SMTP_PORT=587
      - SMTP_USER=candidatures@example.invalid
      - SMTP_PASS=V**Uw61^3*bz5c2AFrx&2d&%
      - SMTP_FROM=JobbingTrack <candidatures@example.invalid>
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # Service du dashboard - supprimé car il existe dans docker-compose.yml principal

  # Service des appels téléphoniques
  call-service:
