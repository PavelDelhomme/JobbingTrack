services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-postgres
    environment:
      POSTGRES_DB: jobbingtrack
      POSTGRES_USER: jobbingtrack
      POSTGRES_PASSWORD: jobbingtrack123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack -d jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis
    ports:
      - "6379:6379"
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service de statistiques Docker (nécessaire pour les métriques)
  docker-stats-service:
    build:
      context: ./docker-stats-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-docker-stats
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=development
      - PORT=3015
    volumes:
      # ✅ Monter le socket Docker pour accéder aux statistiques
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service de métriques système
  system-metrics-service:
    build:
      context: ./system-metrics-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-system-metrics
    ports:
      - "3018:3018"
    environment:
      - NODE_ENV=development
      - PORT=3018
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD:-jobbingtrack123}@postgres:5432/${POSTGRES_DB:-jobbingtrack}?schema=metrics
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # Service de gestion des déploiements
  deployment-service:
    build:
      context: ./deployment-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-deployment-service
    ports:
      - "3016:3016"
    environment:
      - NODE_ENV=development
      - PORT=3016
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=deployment
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # Service de sécurité et surveillance
  security-service:
    build:
      context: ./security-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-security-service
    ports:
      - "3017:3017"
    environment:
      - NODE_ENV=development
      - PORT=3017
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=security
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: jobbingtrack-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DOCKER_STATS_SERVICE_URL=http://docker-stats-service:3015
      # - AUTH_SERVICE_URL=http://localhost:3001  # Commenté car auth-service a un profil
      # ✅ En développement local, utiliser localhost pour vitesse
      # - APPLICATION_SERVICE_URL=http://localhost:3002  # Commenté car application-service a un profil
      # - COMPANY_SERVICE_URL=http://localhost:3003  # Commenté car company-service a un profil
      # - CONTACT_SERVICE_URL=http://localhost:3004  # Commenté car contact-service a un profil
      # - INTERVIEW_SERVICE_URL=http://localhost:3005  # Commenté car interview-service a un profil
      # - NOTIFICATION_SERVICE_URL=http://localhost:3006  # Commenté car notification-service a un profil
      # - DASHBOARD_SERVICE_URL=http://localhost:3007  # Commenté car dashboard-service a un profil
      # - CALL_SERVICE_URL=http://localhost:3008  # Commenté car call-service a un profil
      # - PROFILE_SERVICE_URL=http://localhost:3009  # Commenté car profile-service a un profil
      # - EVENT_SERVICE_URL=http://localhost:3011  # Commenté car event-service a un profil
      # - FOLLOWUP_SERVICE_URL=http://localhost:3012  # Commenté car followup-service a un profil
      - DEPLOYMENT_SERVICE_URL=http://localhost:3016
      - SYSTEM_METRICS_SERVICE_URL=http://localhost:3018
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8081,http://localhost:8080
      - JWT_SECRET=your-secret-key-change-in-production-2025
    volumes:
      # ✅ Monter le docker-compose.yml pour pouvoir redémarrer les services
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    depends_on:
      - docker-stats-service
    networks:
      - jobbingtrack-network

  # Service d'authentification
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - JWT_REFRESH_SECRET=your-refresh-secret-change-too-2025
      - SMTP_HOST=smtp.ovh.net
      - SMTP_PORT=587
      - SMTP_USER=candidatures@example.invalid
      - SMTP_PASS=V**Uw61^3*bz5c2AFrx&2d&%
      - SMTP_FROM=JobbingTrack <candidatures@example.invalid>
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network

  # Service des candidatures
  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-application-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des entreprises
  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-company-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=your-secret-key-change-in-production-2025
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network

  # Service des contacts
  contact-service:
    build:
      context: ./contact-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-contact-service
    ports:
      - "3004:3004"
