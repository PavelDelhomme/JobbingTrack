global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Le job qui scrape lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scraping du JobbingTrack Metrics Aggregator Service
  - job_name: 'jobbingtrack-metrics-aggregator'
    static_configs:
      - targets: ['jobbingtrack-metrics-aggregator:3014']
    scrape_interval: 10s

  # Scraping de cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s

  # Scraping des services backend avec métriques Prometheus
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    scrape_interval: 10s
    metrics_path: '/metrics'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    scrape_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'application-service'
