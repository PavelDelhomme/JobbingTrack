global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Application Service
  - job_name: 'application-service'
    static_configs:
      - targets: ['application-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Company Service
  - job_name: 'company-service'
    static_configs:
      - targets: ['company-service:3003']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Contact Service
  - job_name: 'contact-service'
    static_configs:
      - targets: ['contact-service:3004']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Interview Service
  - job_name: 'interview-service'
    static_configs:
      - targets: ['interview-service:3005']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Notification Service
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3006']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Dashboard Service
  - job_name: 'dashboard-service'
    static_configs:
      - targets: ['dashboard-service:3007']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
