version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-postgres-prod
    environment:
      POSTGRES_DB: jobbingtrack
      POSTGRES_USER: jobbingtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobbingtrack123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack -d jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis-prod
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: jobbingtrack-api-gateway-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - APPLICATION_SERVICE_URL=http://application-service:3002
      - COMPANY_SERVICE_URL=http://company-service:3003
      - CONTACT_SERVICE_URL=http://contact-service:3004
      - INTERVIEW_SERVICE_URL=http://interview-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - DASHBOARD_SERVICE_URL=http://dashboard-service:3007
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      - auth-service
      - application-service
      - company-service
      - contact-service
      - interview-service
      - notification-service
      - dashboard-service
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service d'authentification
  auth-service:
    image: jobbingtrack-auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-auth-service-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-change-too-2025}
      - SMTP_HOST=${SMTP_HOST:-smtp.ovh.net}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-alerts@example.invalid}
      - SMTP_PASS=${SMTP_PASS:-V**Uw61^3*bz5c2AFrx&2d&%}
      - SMTP_FROM=${SMTP_FROM:-JobbingTrack <alerts@example.invalid>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service des candidatures
  application-service:
    image: jobbingtrack-application-service
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-application-service-prod
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service des entreprises
  company-service:
    image: jobbingtrack-company-service
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-company-service-prod
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service des contacts
  contact-service:
    image: jobbingtrack-contact-service
    build:
      context: ./contact-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-contact-service-prod
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service des entretiens
  interview-service:
    image: jobbingtrack-interview-service
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-interview-service-prod
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service des notifications
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-notification-service-prod
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST:-smtp.ovh.net}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-alerts@example.invalid}
      - SMTP_PASS=${SMTP_PASS:-V**Uw61^3*bz5c2AFrx&2d&%}
      - SMTP_FROM=${SMTP_FROM:-JobbingTrack <alerts@example.invalid>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service du dashboard
  dashboard-service:
    build:
      context: ./dashboard-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-dashboard-service-prod
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # Service d'agrégation de métriques
  jobbingtrack-metrics-aggregator:
    build:
      context: ./metrics-aggregator-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-metrics-aggregator-prod
    ports:
      - "3014:3014"
    environment:
      - NODE_ENV=production
      - PORT=3014
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    networks:
      - jobbingtrack-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  jobbingtrack-network:
    driver: bridge