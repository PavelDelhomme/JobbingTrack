      - SMTP_USER=${SMTP_USER:-candidatures@delhomme.ovh}
      - SMTP_PASS=${SMTP_PASS:-V**Uw61^3*bz5c2AFrx&2d&%}
      - SMTP_FROM=${SMTP_FROM:-JobbingTrack <candidatures@delhomme.ovh>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:3000,http://localhost:8080}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    networks:
      - jobbingtrack-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
