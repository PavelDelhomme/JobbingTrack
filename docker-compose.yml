# Configuration centralisée avec profiles

services:

  # =====================================
  # SERVICES ESSENTIELS (pas de profile = toujours démarrés)
  # =====================================

  # Base de données principale (image Debian pour locales correctes ; Alpine affiche "no usable system locales")
  postgres:
    image: postgres:15
    container_name: jobbingtrack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5000}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - jobbingtrack_postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack -d jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jobbingtrack-network

  # Redis pour le cache et les sessions (WARNING Memory overcommit = réglage hôte : sysctl vm.overcommit_memory=1)
  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis
    ports:
      - "${REDIS_PORT:-5001}:${REDIS_INTERNAL_PORT:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # API Gateway (coeur du système). Contexte backend pour inclure generate-test-data.js + prisma.
  api-gateway:
    image: jobbingtrack-api-gateway
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile.backend-context
    container_name: jobbingtrack-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-5002}:${API_GATEWAY_INTERNAL_PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WAF_ENABLED=false
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SECURITY_INTERNAL_SECRET=${SECURITY_INTERNAL_SECRET:-jobbingtrack-internal-security-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_INTERNAL_PORT:-3001}
      - DASHBOARD_SERVICE_URL=http://dashboard-service:${DASHBOARD_SERVICE_INTERNAL_PORT:-3000}
      - SECURITY_SERVICE_URL=${SECURITY_SERVICE_URL:-http://security-service:3017}
      - SECURITY_INTERNAL_SECRET=${SECURITY_INTERNAL_SECRET:-jobbingtrack-internal-security-dev}
    volumes:
      # ✅ Monter le code source pour le développement (hot reload)
      - ./backend/api-gateway/src:/app/src
      - ./backend/api-gateway/package.json:/app/package.json:ro
      # Script génération données de test (route admin generate-test-data)
      - ./backend/generate-test-data.js:/app/generate-test-data.js:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  
  # Frontend Dashboard Administrateur
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        - NODE_ENV=development
    container_name: jobbingtrack-frontend
    # Sous Linux, host.docker.internal n'existe pas par défaut → le proxy Build APK ne peut pas joindre le contrôleur sur l'hôte
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-5003}:${FRONTEND_INTERNAL_PORT:-3000}"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${HOST_IP:-192.168.1.134}:${API_GATEWAY_PORT:-5002}}
      - NEXT_PUBLIC_AUTH_SERVICE_URL=${NEXT_PUBLIC_AUTH_SERVICE_URL:-http://${HOST_IP:-192.168.1.134}:${AUTH_SERVICE_PORT:-5005}}
      - NEXT_PUBLIC_METRICS_URL=${NEXT_PUBLIC_METRICS_URL:-http://${HOST_IP:-192.168.1.134}:${METRICS_AGGREGATOR_PORT:-5004}}
      - HOST_IP=${HOST_IP:-192.168.1.134}
      - FRONTEND_PORT=${FRONTEND_PORT:-5003}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT:-5002}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-5005}
      - METRICS_AGGREGATOR_PORT=${METRICS_AGGREGATOR_PORT:-5004}
      - NEXT_PUBLIC_APP_NAME=JobbingTrack
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - API_GATEWAY_URL=http://api-gateway:${API_GATEWAY_INTERNAL_PORT:-3000}
      - WATCHPACK_POLLING=true
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - PROJECT_ROOT=/app
      - TESTS_RESULTS_DIR=/app/tests/results
      - USER_JOURNEY_REPORTS_DIR=/tmp/tests/user-journey-reports
      - TZ=${TZ:-Europe/Paris}
      - NEXT_PUBLIC_TZ=${TZ:-Europe/Paris}
      - EMULATOR_CONTROLLER_URL=${EMULATOR_CONTROLLER_URL:-http://host.docker.internal:5055}
    volumes:
      - ./frontend:/app
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./tests/user-journey-reports:/tmp/tests/user-journey-reports
      - /app/node_modules
      - /app/.next
    user: "1001:1001"
    working_dir: /app
    networks:
      - jobbingtrack-network
    command: sh -c "npm run dev -- -H 0.0.0.0"
    depends_on:
      - api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  
  # Collecteur de métriques en C (ex-systems) – CPU, mémoire, réseau, health checks
  monitoring-c:
    build:
      context: ./ex-systems/monitoring-c
      dockerfile: Dockerfile
    image: jobbingtrack-monitoring-c
    container_name: jobbingtrack-monitoring-c
    user: "0:0"
    ports:
      - "${MONITORING_C_PORT:-5098}:8015"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - COLLECTION_INTERVAL=${METRICS_COLLECTION_INTERVAL_SEC:-15}
      - PROCFS_PATH=/host/proc
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-jobbingtrack}
      - POSTGRES_USER=${POSTGRES_USER:-jobbingtrack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jobbingtrack123}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - jobbingtrack-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "monitoring-c"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - monitoring

  # Metrics Aggregator – API unique pour le backoffice (s’alimente depuis monitoring-c ou fallback Node)
  jobbingtrack-metrics-aggregator:
    image: jobbingtrack-metrics-aggregator
    build:
      context: ./backend/metrics-aggregator-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-metrics-aggregator
    user: "0:0"
    ports:
      - "${METRICS_AGGREGATOR_PORT:-5004}:${METRICS_AGGREGATOR_INTERNAL_PORT:-3014}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3014/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=development
      - PORT=3014
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - MONITORING_C_URL=http://monitoring-c:8015
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5003}
      - METRICS_API_KEY=jobbingtrack-metrics-secret-key
      - METRICS_COLLECTION_INTERVAL=${METRICS_COLLECTION_INTERVAL:-300000}
      - ENABLE_METRICS_COLLECTION=${ENABLE_METRICS_COLLECTION:-true}
      - SYSTEM_METRICS_RETENTION_DAYS=${SYSTEM_METRICS_RETENTION_DAYS:-90}
      - CONTAINER_METRICS_RETENTION_DAYS=${CONTAINER_METRICS_RETENTION_DAYS:-30}
      - LOGS_RETENTION_DAYS=${LOGS_RETENTION_DAYS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - jobbingtrack_metrics_data:/tmp/metrics
    networks:
      - jobbingtrack-network
    depends_on:
      postgres:
        condition: service_healthy
      monitoring-c:
        condition: service_started
    restart: unless-stopped
    profiles:
      - monitoring

  # =====================================
  # SERVICES OPTIONNELS (avec profiles)
  # =====================================

  # Service d'authentification
  auth-service:
    image: jobbingtrack-auth-service
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-5005}:${AUTH_SERVICE_INTERNAL_PORT:-3001}"
    volumes:
      # ✅ Monter le code source pour le développement (hot reload)
      - ./backend/auth-service/src:/app/src
      - ./backend/auth-service/package.json:/app/package.json:ro
      # ✅ Monter les scripts de test
      - ./backend/auth-service/test-email-python.js:/app/test-email-python.js:ro
      - ./backend/auth-service/test-email-diagnostic.js:/app/test-email-diagnostic.js:ro
    command: npm run dev
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SMTP_HOST=${SMTP_HOST:-ssl0.ovh.net}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_REPLY_TO=${SMTP_REPLY_TO:-${SMTP_FROM}}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-SMTP}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5003}
      - APP_URL=${APP_URL:-http://localhost:5003}
      - HOST_IP=${HOST_IP:-localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@jobbingtrack.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password123}
      - SECURITY_SERVICE_URL=${SECURITY_SERVICE_URL:-http://security-service:3017}
      - SECURITY_INTERNAL_SECRET=${SECURITY_INTERNAL_SECRET:-jobbingtrack-internal-security-dev}
    networks:
      - jobbingtrack-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - auth
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/v1/auth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Application
  application-service:
    image: jobbingtrack-application-service
    build:
      context: ./backend/application-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-application-service
    ports:
      - "${APPLICATION_SERVICE_PORT:-5006}:${APPLICATION_SERVICE_INTERNAL_PORT:-3002}"
    volumes:
      # ✅ Monter le code source pour le développement (hot reload)
      - ./backend/application-service/src:/app/src
      - ./backend/application-service/package.json:/app/package.json:ro
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_INTERNAL_PORT:-3001}
      - PORT=3002
      - LOG_LEVEL=info
      - METRICS_SERVICE_URL=http://jobbingtrack-metrics-aggregator:3014
      - SERVICE_NAME=application-service
      - ENABLE_CENTRAL_LOGGING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - applications
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/api/v1/applications/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service des candidatures - DÉFINI CI-DESSUS

  # Service Company
  company-service:
    image: jobbingtrack-company-service
    build:
      context: ./backend/company-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-company-service
    ports:
      - "${COMPANY_SERVICE_PORT:-5007}:${COMPANY_SERVICE_INTERNAL_PORT:-3003}"
    volumes:
      # ✅ Monter le code source pour le développement (hot reload)
      - ./backend/company-service/src:/app/src
      - ./backend/company-service/package.json:/app/package.json:ro
    command: npm run dev
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_INTERNAL_PORT:-3001}
      - METRICS_SERVICE_URL=http://jobbingtrack-metrics-aggregator:3014
      - SERVICE_NAME=company-service
      - ENABLE_CENTRAL_LOGGING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - companies
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/api/v1/companies/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service des entreprises - DÉFINI CI-DESSUS


  # Service Contact
  contact-service:
    image: jobbingtrack-contact-service
    build:
      context: ./backend/contact-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-contact-service
    ports:
      - "${CONTACT_SERVICE_PORT:-5008}:${CONTACT_SERVICE_INTERNAL_PORT:-3004}"
    volumes:
      - ./backend/contact-service/src:/app/src
      - ./backend/contact-service/package.json:/app/package.json:ro
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_INTERNAL_PORT:-3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - contacts
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/api/v1/contacts/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # Service Interview
  interview-service:
    image: jobbingtrack-interview-service
    build:
      context: ./backend/interview-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-interview-service
    ports:
      - "${INTERVIEW_SERVICE_PORT:-5009}:${INTERVIEW_SERVICE_INTERNAL_PORT:-3005}"
    volumes:
      - ./backend/interview-service/src:/app/src
      - ./backend/interview-service/package.json:/app/package.json:ro
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - interviews
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3005/api/v1/interviews/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Call
  call-service:
    image: jobbingtrack-call-service
    build:
      context: ./backend/call-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-call-service
    ports:
      - "${CALL_SERVICE_PORT:-5010}:${CALL_SERVICE_INTERNAL_PORT:-3008}"
    volumes:
      - ./backend/call-service/src:/app/src
      - ./backend/call-service/package.json:/app/package.json:ro
    environment:
      - NODE_ENV=development
      - PORT=${CALL_SERVICE_INTERNAL_PORT:-3008}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - calls
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3008/api/v1/calls/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Event
  event-service:
    image: jobbingtrack-event-service
    build:
      context: ./backend/event-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-event-service
    ports:
      - "${EVENT_SERVICE_PORT:-5011}:${EVENT_SERVICE_INTERNAL_PORT:-3011}"
    environment:
      - NODE_ENV=development
      - PORT=${EVENT_SERVICE_INTERNAL_PORT:-3011}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - events
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3011/api/v1/events/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Followup
  followup-service:
    image: jobbingtrack-followup-service
    build:
      context: ./backend/followup-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-followup-service
    ports:
      - "${FOLLOWUP_SERVICE_PORT:-5012}:${FOLLOWUP_SERVICE_INTERNAL_PORT:-3012}"
    volumes:
      - ./backend/followup-service/src:/app/src
      - ./backend/followup-service/package.json:/app/package.json:ro
    environment:
      - NODE_ENV=development
      - PORT=${FOLLOWUP_SERVICE_INTERNAL_PORT:-3012}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - followups
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3012/api/v1/followups/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # Service Profile
  profile-service:
    image: jobbingtrack-profile-service
    build:
      context: ./backend/profile-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-profile-service
    ports:
      - "${PROFILE_SERVICE_PORT:-5013}:${PROFILE_SERVICE_INTERNAL_PORT:-3009}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - profiles
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3009/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Notification
  notification-service:
    image: jobbingtrack-notification-service
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-5014}:${NOTIFICATION_SERVICE_INTERNAL_PORT:-3008}"
    environment:
      - NODE_ENV=development
      - PORT=${NOTIFICATION_SERVICE_INTERNAL_PORT:-3008}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-noreply@jobbingtrack.com}
      - CRASH_REPORT_EMAIL=${CRASH_REPORT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - notifications
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Dashboard (si différent du frontend)
  dashboard-service:
    image: jobbingtrack-dashboard-service
    build:
      context: ./backend/dashboard-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-dashboard-service
    ports:
      - "${DASHBOARD_SERVICE_PORT:-5015}:${DASHBOARD_SERVICE_INTERNAL_PORT:-3000}"
    volumes:
      # ✅ Monter le code source pour le développement (hot reload)
      - ./backend/dashboard-service/src:/app/src
      - ./backend/dashboard-service/package.json:/app/package.json:ro
    command: npm start
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service:${AUTH_SERVICE_INTERNAL_PORT:-3001}
      - APPLICATION_SERVICE_URL=http://jobbingtrack-application-service:${APPLICATION_SERVICE_INTERNAL_PORT:-3002}
      - COMPANY_SERVICE_URL=http://jobbingtrack-company-service:${COMPANY_SERVICE_INTERNAL_PORT:-3003}
      - CONTACT_SERVICE_URL=http://jobbingtrack-contact-service:${CONTACT_SERVICE_INTERNAL_PORT:-3004}
      - INTERVIEW_SERVICE_URL=http://jobbingtrack-interview-service:${INTERVIEW_SERVICE_INTERNAL_PORT:-3005}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - dashboard
      - full
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Workflow
  workflow-service:
    image: jobbingtrack-workflow-service
    build:
      context: ./backend/workflow-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-workflow-service
    ports:
      - "${WORKFLOW_SERVICE_PORT:-5016}:${WORKFLOW_SERVICE_INTERNAL_PORT:-3013}"
    environment:
      - NODE_ENV=development
      - PORT=${WORKFLOW_SERVICE_INTERNAL_PORT:-3013}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - workflows
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3013/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Application mobile Flutter
  flutter-mobile:
    build:
      context: ./flutter-mobile-app
      dockerfile: Dockerfile
    container_name: jobbingtrack-flutter-mobile
    ports:
      - "${FLUTTER_MOBILE_PORT:-5019}:${FLUTTER_MOBILE_INTERNAL_PORT:-8080}"  # Interface web de l'émulateur Flutter
    environment:
      - NODE_ENV=development
    networks:
      - jobbingtrack-network
    profiles:
      - mobile

  # Security Service
  security-service:
    image: jobbingtrack-security-service
    build:
      context: ./backend/security-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-security-service
    ports:
      - "${SECURITY_SERVICE_PORT:-5017}:${SECURITY_SERVICE_INTERNAL_PORT:-3017}"
    environment:
      - NODE_ENV=development
      - PORT=3017
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5003}
      - LOG_LEVEL=info
      - SECURITY_SERVICE_URL=http://security-service:3017
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - SECURITY_INTERNAL_SECRET=${SECURITY_INTERNAL_SECRET:-jobbingtrack-internal-security-dev}
      - PRISMA_DISABLE_WARNINGS=true
      - DEBUG=
      - WAF_ENABLED=${WAF_ENABLED:-true}
    volumes:
      # Même principe que api-gateway : le code src sur l’hôte est pris en compte sans rebuild image
      - ./backend/security-service/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # nftables/iptables dans le conteneur : souvent « Permission denied » avec USER non-root du Dockerfile ;
    # en dev on force root pour que les règles firewall s’appliquent réellement (prod : privilégier un sidecar / hôte).
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - security
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3017/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service de gestion des déploiements
  deployment-service:
    image: jobbingtrack-deployment-service
    build:
      context: ./backend/deployment-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-deployment-service
    ports:
      - "${DEPLOYMENT_SERVICE_PORT:-5018}:${DEPLOYMENT_SERVICE_INTERNAL_PORT:-3016}"
    environment:
      - NODE_ENV=development
      - PORT=3016
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    profiles:
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3016/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MailHog : capture des emails en dev/test (SMTP 1025, Web UI 8025)
  # Pour utiliser : make up-full (profil full) ou COMPOSE_PROFILES=mail docker compose up -d
  # Puis SMTP_HOST=mailhog SMTP_PORT=1025 pour auth-service ; interface http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobbingtrack-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-2525}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - jobbingtrack-network
    profiles:
      - mail
      - full
    restart: unless-stopped

volumes:
  jobbingtrack_postgres_data:
    name: jobbingtrack_postgres_data
  jobbingtrack_metrics_data:
    name: jobbingtrack_metrics_data

networks:
  jobbingtrack-network:
    driver: bridge
