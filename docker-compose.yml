services:
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobbingtrack
      POSTGRES_PASSWORD: jobbingtrack123
      POSTGRES_DB: jobbingtrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend  
      dockerfile: Dockerfile
    container_name: jobbingtrack-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      JWT_SECRET: your-secret-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-too
      PORT: 3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Commande simple qui marche
    command: sh -c "
      echo 'Waiting for database...' &&
      sleep 5 &&
      echo 'Running migrations...' &&
      npx prisma migrate dev --name init --skip-generate &&
      echo 'Seeding database...' &&
      node prisma/seed.js &&
      echo 'Starting server...' &&
      npm run dev
      "

  adminer:
    image: adminer
    container_name: jobbingtrack-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres