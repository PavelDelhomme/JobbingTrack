version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobbingtrack
      POSTGRES_PASSWORD: jobbingtrack123
      POSTGRES_DB: jobbingtrack
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour cache et sessions
  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - jobbingtrack-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobbingtrack-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: votre-super-secret-jwt-changez-en-production-2024
      JWT_REFRESH_SECRET: votre-secret-refresh-token-changez-aussi-2024
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081,http://localhost:19006
      # Email configuration (optionnel pour le dev)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      EMAIL_FROM: "JobbingTrack <noreply@jobbingtrack.com>"
      # Upload configuration
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: image/jpeg,image/png,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
      # Frontend URL pour les emails
      FRONTEND_URL: http://localhost:8081
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - jobbingtrack-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"

  # Adminer pour gérer la base de données (dev uniquement)
  adminer:
    image: adminer
    container_name: jobbingtrack-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - jobbingtrack-network
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha

networks:
  jobbingtrack-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local