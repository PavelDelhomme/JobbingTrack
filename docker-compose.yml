# Configuration centralisée avec profiles

services:

  # =====================================
  # SERVICES ESSENTIELS (pas de profile = toujours démarrés)
  # =====================================

  # Base de données principale
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobbingtrack}
      POSTGRES_USER: ${POSTGRES_USER:-jobbingtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobbingtrack123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbingtrack -d jobbingtrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jobbingtrack-network

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # API Gateway Ancien
  # api-gateway:
  #   build:
  #     dockerfile: Dockerfile
  #   container_name: jobbingtrack-api-gateway
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3000
  #     - AUTH_SERVICE_URL=http://auth-service:3001
  #     - APPLICATION_SERVICE_URL=http://application-service:3002
  #     - COMPANY_SERVICE_URL=http://company-service:3003
  #     - CONTACT_SERVICE_URL=http://contact-service:3004
  #     - INTERVIEW_SERVICE_URL=http://interview-service:3005
  #     - NOTIFICATION_SERVICE_URL=http://notification-service:3006
  #     - DASHBOARD_SERVICE_URL=http://dashboard-service:3007
  #     - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8081
  #   depends_on:
  #     - auth-service
  #     - application-service
  #     - company-service
  #     - contact-service
  #     - interview-service
  #     - notification-service
  #     - dashboard-service
  #   networks:
  #     - jobbingtrack-network

  # API Gateway (coeur du système)
  api-gateway:
    image: jobbingtrack-api-gateway
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: jobbingtrack-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WAF_ENABLED=false
      - DATABASE_URL=postgresql://jobbingtrack:jobbingtrack123@postgres:5432/jobbingtrack?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-2025}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-change-too-2025}
      - REDIS_URL=redis://redis:6379
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  
  # Frontend Dashboard Administrateur
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        - NODE_ENV=development
    container_name: jobbingtrack-frontend
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000
      - NEXT_PUBLIC_METRICS_URL=http://localhost:3014
      - NEXT_PUBLIC_APP_NAME=JobbingTrack
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - WATCHPACK_POLLING=true
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    user: "1001:1001"
    working_dir: /app
    networks:
      - jobbingtrack-network
    command: sh -c "npm run dev -- -H 0.0.0.0"
    depends_on:
      - api-gateway
    restart: unless-stopped
  
  # Metrics Aggregator (monitoring essentiel)
  jobbingtrack-metrics-aggregator:
    image: jobbingtrack-metrics-aggregator
    build:
      context: ./backend/metrics-aggregator-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-metrics-aggregator
    ports:
      - "3014:3014"
    environment:
      - NODE_ENV=development
      - PORT=3014
      - CADVISOR_URL=http://cadvisor:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - cadvisor
    networks:
      - jobbingtrack-network
    profiles:
      - monitoring
      - full
    restart: unless-stopped
  
  # cAdvisor (monitoring conteneurs)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: jobbingtrack-cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - jobbingtrack-network
    profiles:
      - monitoring
      - full
    restart: unless-stopped
  

