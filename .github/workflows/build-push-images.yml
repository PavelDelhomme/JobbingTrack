name: Build and Push Container Images

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/production/**'
      - '.github/workflows/build-push-images.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag image supplementaire (ex. v1.0.0)'
        required: false
      channel:
        description: 'Canal images (preprod=tag branche ; prod=ajoute :latest+:prod + URLs jobbingtrack.com)'
        required: true
        default: preprod
        type: choice
        options:
          - preprod
          - prod

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: backend
            dockerfile: api-gateway/Dockerfile.backend-context
          - image: auth-service
            context: backend/auth-service
            dockerfile: Dockerfile
          - image: application-service
            context: backend/application-service
            dockerfile: Dockerfile
          - image: company-service
            context: backend/company-service
            dockerfile: Dockerfile
          - image: contact-service
            context: backend/contact-service
            dockerfile: Dockerfile
          - image: interview-service
            context: backend/interview-service
            dockerfile: Dockerfile
          - image: notification-service
            context: backend/notification-service
            dockerfile: Dockerfile
          - image: dashboard-service
            context: backend/dashboard-service
            dockerfile: Dockerfile
          - image: call-service
            context: backend/call-service
            dockerfile: Dockerfile
          - image: profile-service
            context: backend/profile-service
            dockerfile: Dockerfile
          - image: event-service
            context: backend/event-service
            dockerfile: Dockerfile
          - image: followup-service
            context: backend/followup-service
            dockerfile: Dockerfile
          - image: workflow-service
            context: backend/workflow-service
            dockerfile: Dockerfile
          - image: security-service
            context: backend/security-service
            dockerfile: Dockerfile
          - image: metrics-aggregator
            context: backend/metrics-aggregator-service
            dockerfile: Dockerfile
          - image: frontend
            context: frontend
            dockerfile: Dockerfile
            target: production
            has_target: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Obligatoire pour cache-from/to type=gha (sinon: "Cache export is not supported for the docker driver")
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta tags
        id: meta
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          PREFIX="ghcr.io/${OWNER}/jobbingtrack"
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          CHANNEL="${{ github.event.inputs.channel || 'preprod' }}"
          TAGS="${PREFIX}-${{ matrix.image }}:${BRANCH},${PREFIX}-${{ matrix.image }}:sha-${SHORT_SHA}"
          if [ "${BRANCH}" = "main" ] || [ "${CHANNEL}" = "prod" ]; then
            TAGS="${TAGS},${PREFIX}-${{ matrix.image }}:latest,${PREFIX}-${{ matrix.image }}:prod"
          fi
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="${TAGS},${PREFIX}-${{ matrix.image }}:${{ github.event.inputs.tag }}"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Frontend public URLs (baked at build)
        id: fe_args
        if: matrix.has_target
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'preprod' }}"
          if [ "${{ github.ref_name }}" = "main" ] || [ "${CHANNEL}" = "prod" ]; then
            API="https://api.jobbingtrack.com"
            WEB="https://jobbingtrack.com"
          else
            API="https://api-preprod.jobbingtrack.com"
            WEB="https://preprod.jobbingtrack.com"
          fi
          {
            echo "args<<EOF"
            echo "NEXT_PUBLIC_API_URL=${API}"
            echo "NEXT_PUBLIC_API_GATEWAY_URL=${API}"
            echo "NEXT_PUBLIC_AUTH_SERVICE_URL=${API}"
            echo "NEXT_PUBLIC_FRONTEND_URL=${WEB}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (default target)
        if: ${{ !matrix.has_target }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push (production frontend)
        if: matrix.has_target
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.fe_args.outputs.args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ghcr-public-hint:
    name: GHCR packages visibility
    runs-on: ubuntu-latest
    needs: build-push
    if: success()
    permissions:
      packages: write
    steps:
      - name: Tenter rendre les packages publics (Portainer CE sans login)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          for pkg in api-gateway auth-service application-service company-service contact-service \
            interview-service notification-service dashboard-service call-service profile-service \
            event-service followup-service workflow-service security-service metrics-aggregator frontend; do
            NAME="jobbingtrack-${pkg}"
            if gh api --method PATCH "/users/${OWNER}/packages/container/${NAME}" -f visibility=public 2>/dev/null; then
              echo "OK user package ${NAME}"
            elif gh api --method PATCH "/orgs/${OWNER}/packages/container/${NAME}" -f visibility=public 2>/dev/null; then
              echo "OK org package ${NAME}"
            else
              echo "::warning::Package ${NAME} — passer en Public manuellement si Portainer ne pull pas"
            fi
          done

  notify-portainer:
    name: Webhook Portainer
    runs-on: ubuntu-latest
    needs: build-push
    if: success()
    steps:
      - name: Webhook preprod (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          WEBHOOK_URL: ${{ secrets.DEV_DEPLOY_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "DEV_DEPLOY_URL non defini — redeploy via:"
            echo "  bash scripts/deploy/redeploy-vps.sh preprod"
            echo "  ou Watchtower (deploy/watchtower-compose.yml) sous ~5 min"
            exit 0
          fi
          curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}"

      - name: Webhook prod (main)
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "PROD_DEPLOY_URL non defini — redeploy via:"
            echo "  bash scripts/deploy/admin-deploy-prod.sh web  (merge dev→main déjà fait si push direct main)"
            echo "  bash scripts/deploy/redeploy-vps.sh prod"
            echo "  ou Watchtower sous ~5 min"
            exit 0
          fi
          curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}"
