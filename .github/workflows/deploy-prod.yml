name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ecrire deploy pour confirmer'
        required: true

env:
  DOCKER_BUILDKIT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-prod:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Verification manuelle (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation requise : ecrire deploy pour lancer."
            exit 1
          fi

      - name: Resume deploiement production
        run: |
          echo "## Deploiement Production - JobbingTrack" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Deploiement (webhook Portainer)
        env:
          WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "PROD_DEPLOY_URL non defini : configurer le webhook GitOps Portainer (stack jobbingtrack, branche main)."
            echo "Compose : deploy/production/docker-compose.yml — voir docs/production/PORTAINER_STACK.md"
            exit 0
          fi
          curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}"
