name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ecrire deploy pour confirmer'
        required: true

env:
  DOCKER_BUILDKIT: 1

jobs:
  deploy-prod:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verification manuelle (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation requise : ecrire deploy pour lancer."
            exit 1
          fi

      - name: Resume deploiement production
        run: |
          echo "## Deploiement Production - JobbingTrack" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Deploiement (placeholder)
        run: |
          if [ -n "${{ secrets.PROD_DEPLOY_URL }}" ]; then
            curl -f -X POST "${{ secrets.PROD_DEPLOY_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}" || true
          else
            echo "PROD_DEPLOY_URL non defini : deploiement production non execute."
          fi
