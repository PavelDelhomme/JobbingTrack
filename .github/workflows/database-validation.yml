name: Database Schema Validation

on:
  push:
    branches:
      - main
      - develop
      - tech/**
    paths:
      - 'backend/prisma/schema.prisma'
      - 'backend/prisma/seed.js'
      - 'backend/prisma/migrations/**'
      - '.github/workflows/database-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/prisma/schema.prisma'
      - 'backend/prisma/seed.js'
      - 'backend/prisma/migrations/**'

jobs:
  validate-schema:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/prisma/package-lock.json

      - name: Install dependencies
        working-directory: backend/prisma
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend/prisma
        run: npx prisma validate

      - name: Format Check
        working-directory: backend/prisma
        run: npx prisma format --check

      - name: Verify Status Models (Tables, not Enums)
        working-directory: backend/prisma
        run: |
          echo "🔍 Vérification des modèles de statuts personnalisables..."
          
          # Vérifier que les modèles de statuts existent (tables)
          if grep -q "^model ApplicationStatus {" schema.prisma; then
            echo "✅ Modèle ApplicationStatus trouvé (table)"
          else
            echo "❌ Modèle ApplicationStatus manquant"
            exit 1
          fi

          if grep -q "^model InterviewStatus {" schema.prisma; then
            echo "✅ Modèle InterviewStatus trouvé (table)"
          else
            echo "❌ Modèle InterviewStatus manquant"
            exit 1
          fi

          if grep -q "^model FollowUpStatus {" schema.prisma; then
            echo "✅ Modèle FollowUpStatus trouvé (table)"
          else
            echo "❌ Modèle FollowUpStatus manquant"
            exit 1
          fi

          # Vérifier que les enums ont été supprimés
          if grep -q "^enum ApplicationStatus" schema.prisma; then
            echo "❌ ERREUR: Enum ApplicationStatus existe encore"
            exit 1
          fi

          if grep -q "^enum InterviewStatus" schema.prisma; then
            echo "❌ ERREUR: Enum InterviewStatus existe encore"
            exit 1
          fi

          if grep -q "^enum FollowUpStatus" schema.prisma; then
            echo "❌ ERREUR: Enum FollowUpStatus existe encore"
            exit 1
          fi

          echo "✅ Modèles de statuts validés (tables, pas enums)"

      - name: Verify Synchronization Fields
        working-directory: backend/prisma
        run: |
          echo "🔍 Vérification des champs de synchronisation..."
          
          # Compter les occurrences de champs de synchronisation
          SYNC_COUNT=$(grep -c "syncHash\|entityHash\|lastSyncAt" schema.prisma || echo "0")
          
          if [ "$SYNC_COUNT" -ge 3 ]; then
            echo "✅ Champs de synchronisation présents ($SYNC_COUNT occurrences)"
          else
            echo "⚠️  Champs de synchronisation: $SYNC_COUNT occurrences (attendu: au moins 3)"
          fi

          # Vérifier dans les modèles applicatifs principaux
          for model in Application Company Contact FollowUp Interview Call Event Document; do
            if grep -A 30 "^model $model {" schema.prisma | grep -q "syncHash"; then
              echo "✅ $model a les champs de synchronisation"
            else
              echo "⚠️  $model n'a pas de champs de synchronisation"
            fi
          done

      - name: Generate Prisma Client
        working-directory: backend/prisma
        run: npx prisma generate

  test-migrations:
    name: Test Migrations
    runs-on: ubuntu-latest
    needs: validate-schema
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jobbingtrack
          POSTGRES_PASSWORD: jobbingtrack123
          POSTGRES_DB: jobbingtrack
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/prisma/package-lock.json

      - name: Install dependencies
        working-directory: backend/prisma
        run: npm ci

      - name: Apply Migrations
        working-directory: backend/prisma
        env:
          DATABASE_URL: postgresql://jobbingtrack:jobbingtrack123@localhost:5432/jobbingtrack
        run: npx prisma migrate deploy

      - name: Run Seed
        working-directory: backend/prisma
        env:
          DATABASE_URL: postgresql://jobbingtrack:jobbingtrack123@localhost:5432/jobbingtrack
        run: node seed.js

      - name: Validate Database Structure
        env:
          PGPASSWORD: jobbingtrack123
        run: |
          echo "🔍 Checking database structure..."
          
          # Count tables
          TABLES=$(psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "📊 Tables created: $TABLES"
          
          if [ "$TABLES" -lt 15 ]; then
            echo "❌ ERROR: Expected at least 15 tables, found $TABLES"
            exit 1
          fi
          
          # Vérifier que les tables de statuts existent
          if psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'ApplicationStatus');" | grep -q t; then
            echo "✅ Table ApplicationStatus existe"
          else
            echo "❌ Table ApplicationStatus manquante"
            exit 1
          fi

          if psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'InterviewStatus');" | grep -q t; then
            echo "✅ Table InterviewStatus existe"
          else
            echo "❌ Table InterviewStatus manquante"
            exit 1
          fi

          if psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'FollowUpStatus');" | grep -q t; then
            echo "✅ Table FollowUpStatus existe"
          else
            echo "❌ Table FollowUpStatus manquante"
            exit 1
          fi

          # Vérifier les statuts système (doivent être créés par le seed)
          APP_STATUS_COUNT=$(psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT COUNT(*) FROM \"ApplicationStatus\" WHERE \"isPredefined\" = true;" | tr -d ' ')
          if [ "$APP_STATUS_COUNT" -ge 12 ]; then
            echo "✅ Statuts système ApplicationStatus créés ($APP_STATUS_COUNT/12)"
          else
            echo "⚠️  Statuts système ApplicationStatus: $APP_STATUS_COUNT/12 (seed nécessaire)"
          fi

          INT_STATUS_COUNT=$(psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT COUNT(*) FROM \"InterviewStatus\" WHERE \"isPredefined\" = true;" | tr -d ' ')
          if [ "$INT_STATUS_COUNT" -ge 5 ]; then
            echo "✅ Statuts système InterviewStatus créés ($INT_STATUS_COUNT/5)"
          else
            echo "⚠️  Statuts système InterviewStatus: $INT_STATUS_COUNT/5 (seed nécessaire)"
          fi

          FOL_STATUS_COUNT=$(psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT COUNT(*) FROM \"FollowUpStatus\" WHERE \"isPredefined\" = true;" | tr -d ' ')
          if [ "$FOL_STATUS_COUNT" -ge 5 ]; then
            echo "✅ Statuts système FollowUpStatus créés ($FOL_STATUS_COUNT/5)"
          else
            echo "⚠️  Statuts système FollowUpStatus: $FOL_STATUS_COUNT/5 (seed nécessaire)"
          fi
          
          # Count Foreign Keys
          FKS=$(psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_type = 'FOREIGN KEY';")
          echo "🔗 Foreign Keys: $FKS"
          
          if [ "$FKS" -lt 30 ]; then
            echo "❌ ERROR: Expected at least 30 Foreign Keys, found $FKS"
            exit 1
          fi
          
          # Count predefined platforms
          PLATFORMS=$(psql -h localhost -U jobbingtrack -d jobbingtrack -t -c "SELECT COUNT(*) FROM \"Platform\" WHERE \"isPredefined\" = true;")
          echo "📦 Predefined Platforms: $PLATFORMS"
          
          if [ "$PLATFORMS" -lt 10 ]; then
            echo "❌ ERROR: Expected at least 10 predefined platforms, found $PLATFORMS"
            exit 1
          fi
          
          echo "✅ Database structure validation passed!"

  validate-relationships:
    name: Validate Relationships
    runs-on: ubuntu-latest
    needs: test-migrations
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jobbingtrack
          POSTGRES_PASSWORD: jobbingtrack123
          POSTGRES_DB: jobbingtrack
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/prisma/package-lock.json

      - name: Install dependencies
        working-directory: backend/prisma
        run: npm ci

      - name: Apply Migrations
        working-directory: backend/prisma
        env:
          DATABASE_URL: postgresql://jobbingtrack:jobbingtrack123@localhost:5432/jobbingtrack
        run: npx prisma migrate deploy

      - name: Run Seed
        working-directory: backend/prisma
        env:
          DATABASE_URL: postgresql://jobbingtrack:jobbingtrack123@localhost:5432/jobbingtrack
        run: node seed.js

      - name: Test Database Relationships
        env:
          PGPASSWORD: jobbingtrack123
        run: |
          echo "🔗 Testing database relationships..."
          
          # Test User table exists
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"User\" LIMIT 0;" || exit 1
          echo "✅ User table exists"
          
          # Test Company table exists
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"Company\" LIMIT 0;" || exit 1
          echo "✅ Company table exists"
          
          # Test Application table exists
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"Application\" LIMIT 0;" || exit 1
          echo "✅ Application table exists"
          
          # Test Contact table exists
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"Contact\" LIMIT 0;" || exit 1
          echo "✅ Contact table exists"
          
          # Test all customizable lists
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"Platform\" LIMIT 0;" || exit 1
          echo "✅ Platform table exists"
          
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"FollowUpType\" LIMIT 0;" || exit 1
          echo "✅ FollowUpType table exists"
          
          psql -h localhost -U jobbingtrack -d jobbingtrack -c "SELECT 1 FROM \"InterviewType\" LIMIT 0;" || exit 1
          echo "✅ InterviewType table exists"
          
          echo "✅ All relationship tests passed!"

  security-check:
    name: Security & Best Practices
    runs-on: ubuntu-latest
    needs: validate-schema
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive data
        run: |
          echo "🔒 Checking for sensitive data..."
          
          # Check if .env is committed
          if git ls-files | grep -q "backend/prisma/.env$"; then
            echo "❌ ERROR: .env file is committed!"
            exit 1
          fi
          
          echo "✅ No .env file in git"
          
          # Check if .gitignore exists
          if [ ! -f "backend/prisma/.gitignore" ]; then
            echo "❌ ERROR: .gitignore missing in backend/prisma/"
            exit 1
          fi
          
          echo "✅ .gitignore exists"
          
          # Verify .gitignore content
          if ! grep -q ".env" "backend/prisma/.gitignore"; then
            echo "❌ ERROR: .env not in .gitignore"
            exit 1
          fi
          
          echo "✅ .env is in .gitignore"
          
          echo "✅ Security checks passed!"

      - name: Check schema best practices
        working-directory: backend/prisma
        run: |
          echo "📋 Checking Prisma schema best practices..."
          
          # Check for indexes
          INDEXES=$(grep -c "@@index" schema.prisma || echo "0")
          echo "📊 Indexes found: $INDEXES"
          
          if [ "$INDEXES" -lt 20 ]; then
            echo "⚠️  WARNING: Consider adding more indexes (found $INDEXES)"
          else
            echo "✅ Good number of indexes"
          fi
          
          # Check for timestamps
          if ! grep -q "createdAt" schema.prisma; then
            echo "⚠️  WARNING: No createdAt timestamps found"
          else
            echo "✅ Timestamps present"
          fi
          
          # Check for soft delete
          if ! grep -q "deletedAt" schema.prisma; then
            echo "⚠️  WARNING: No soft delete (deletedAt) found"
          else
            echo "✅ Soft delete implemented"
          fi
          
          echo "✅ Best practices check completed!"

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [validate-schema, test-migrations, validate-relationships, security-check]
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "## 📊 Database Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validation checks passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prisma schema validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Migrations deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Database structure verification" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Relationships testing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Database schema is ready for deployment!" >> $GITHUB_STEP_SUMMARY
