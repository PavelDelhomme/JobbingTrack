global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Le job qui scrape lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor pour les métriques des conteneurs
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s

  # Node Exporter pour les métriques système de l'hôte
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Blackbox Exporter pour tester les endpoints HTTP
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']
    scrape_interval: 30s

  # Services backend de JobbingTrack
  - job_name: 'jobbingtrack-backend'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'  # API Gateway
          - 'host.docker.internal:3001'  # Auth Service
          - 'host.docker.internal:3002'  # Application Service
          - 'host.docker.internal:3003'  # Company Service
          - 'host.docker.internal:3004'  # Contact Service
          - 'host.docker.internal:3005'  # Interview Service
          - 'host.docker.internal:3006'  # Notification Service
          - 'host.docker.internal:3007'  # Dashboard Service
          - 'host.docker.internal:3008'  # Call Service
          - 'host.docker.internal:3009'  # Event Service
          - 'host.docker.internal:3010'  # Followup Service
          - 'host.docker.internal:3011'  # Profile Service
          - 'host.docker.internal:3013'  # Workflow Service
          - 'host.docker.internal:3014'  # Metrics Aggregator
          - 'host.docker.internal:3015'  # Docker Stats Service
    scrape_interval: 15s
    metrics_path: '/metrics'  # Les services doivent exposer des métriques sur /metrics

  # Frontend de JobbingTrack
  - job_name: 'jobbingtrack-frontend'
    static_configs:
      - targets: ['host.docker.internal:3000']  # Frontend sur le même port que API Gateway en externe
    scrape_interval: 30s

  # Base de données PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['host.docker.internal:9187']  # postgres-exporter
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:9121']  # redis-exporter
    scrape_interval: 30s
