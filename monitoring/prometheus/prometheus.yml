global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Le job qui scrape lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor pour les métriques des conteneurs
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s

  # Node Exporter pour les métriques système de l'hôte
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Blackbox Exporter pour tester les endpoints HTTP
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']
    scrape_interval: 30s

  # Services backend de JobbingTrack
  - job_name: 'jobbingtrack-backend'
    dns_sd_configs:
      - names: 
          - 'api-gateway'
          - 'auth-service'
          - 'application-service'
          - 'company-service'
          - 'contact-service'
          - 'interview-service'
          - 'notification-service'
          - 'dashboard-service'
          - 'call-service'
          - 'event-service'
          - 'followup-service'
          - 'profile-service'
          - 'workflow-service'
          - 'jobbingtrack-metrics-aggregator'
        type: 'A'
        port: 3000  # Tous les services sont exposés sur le port 3000 dans le réseau Docker
    scrape_interval: 15s
    metrics_path: '/metrics'  # Les services doivent exposer des métriques sur /metrics

  # Frontend de JobbingTrack
  - job_name: 'jobbingtrack-frontend'
    static_configs:
      - targets: ['frontend:3000']  # Frontend dans le réseau Docker
    scrape_interval: 30s

  # Base de données PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['host.docker.internal:9187']  # postgres-exporter
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:9121']  # redis-exporter
    scrape_interval: 30s
