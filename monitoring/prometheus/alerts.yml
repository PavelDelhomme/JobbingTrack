groups:
  - name: jobbingtrack
    rules:
      # Alertes pour les services backend
      - alert: ServiceDown
        expr: up{job="jobbingtrack-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service JobbingTrack arrêté"
          description: "Le service {{ $labels.instance }} est arrêté depuis plus d'1 minute"

      # Alertes pour les métriques système
      - alert: HighCPUUsage
        expr: 100 - (avg(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation CPU élevée"
          description: "L'utilisation CPU est supérieure à 80% depuis 5 minutes"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation mémoire élevée"
          description: "L'utilisation mémoire est supérieure à 85% depuis 5 minutes"

      # Alertes pour les conteneurs
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conteneur avec utilisation CPU élevée"
          description: "Le conteneur {{ $labels.name }} utilise plus de 70% de CPU depuis 5 minutes"

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conteneur avec utilisation mémoire élevée"
          description: "Le conteneur {{ $labels.name }} utilise plus de 85% de mémoire depuis 5 minutes"

      # Alertes pour la disponibilité des endpoints
      - alert: EndpointDown
        expr: probe_success{job="blackbox-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint non accessible"
          description: "L'endpoint {{ $labels.instance }} n'est pas accessible depuis 2 minutes"
