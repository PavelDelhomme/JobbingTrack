apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: cAdvisor
    type: prometheus
    access: proxy
    url: http://cadvisor:8080/metrics
    editable: true

  - name: Node Exporter
    type: prometheus
    access: proxy
    url: http://node-exporter:9100/metrics
    editable: true
