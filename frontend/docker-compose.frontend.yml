version: '3.8'

services:
  # Frontend
  jobbingtrack-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: jobbingtrack-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=JobbingTrack
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - frontend-network
    restart: unless-stopped

networks:
  frontend-network:
    driver: bridge
