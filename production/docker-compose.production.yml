services:
  # ============================================================================
  # BASE DE DONNÉES ET CACHE
  # ============================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: jobbingtrack-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobbingtrack}
      POSTGRES_USER: ${POSTGRES_USER:-jobbingtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - jobbingtrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobbingtrack} -d ${POSTGRES_DB:-jobbingtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: jobbingtrack-redis-prod
    networks:
      - jobbingtrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # SERVICES BACKEND
  # ============================================================================

  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: jobbingtrack-api-gateway-prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ✅ UTILISER LES NOMS DE CONTENEURS (pas localhost)
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
      - APPLICATION_SERVICE_URL=http://jobbingtrack-application-service-prod:3002
      - COMPANY_SERVICE_URL=http://jobbingtrack-company-service-prod:3003
      - CONTACT_SERVICE_URL=http://jobbingtrack-contact-service-prod:3004
      - INTERVIEW_SERVICE_URL=http://jobbingtrack-interview-service-prod:3005
      - NOTIFICATION_SERVICE_URL=http://jobbingtrack-notification-service-prod:3006
      - DASHBOARD_SERVICE_URL=http://jobbingtrack-dashboard-service-prod:3007
      - CALL_SERVICE_URL=http://jobbingtrack-call-service-prod:3008
      - PROFILE_SERVICE_URL=http://jobbingtrack-profile-service-prod:3009
      - EVENT_SERVICE_URL=http://jobbingtrack-event-service-prod:3011
      - FOLLOWUP_SERVICE_URL=http://jobbingtrack-followup-service-prod:3012
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://jobbingtrack.votredomaine.com}
    depends_on:
      - auth-service
      - application-service
    networks:
      - jobbingtrack-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.votredomaine.com`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-auth-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET doit être défini}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FRONTEND_URL=${FRONTEND_URL:-https://jobbingtrack.votredomaine.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  application-service:
    build:
      context: ../backend/application-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-application-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  company-service:
    build:
      context: ../backend/company-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-company-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  contact-service:
    build:
      context: ../backend/contact-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-contact-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  interview-service:
    build:
      context: ../backend/interview-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-interview-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  notification-service:
    build:
      context: ../backend/notification-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-notification-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - REDIS_URL=redis://jobbingtrack-redis-prod:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  dashboard-service:
    build:
      context: ../backend/dashboard-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-dashboard-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  call-service:
    build:
      context: ../backend/call-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-call-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  profile-service:
    build:
      context: ../backend/profile-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-profile-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3009
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  event-service:
    build:
      context: ../backend/event-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-event-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  followup-service:
    build:
      context: ../backend/followup-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-followup-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3012
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  workflow-service:
    build:
      context: ../backend/workflow-service
      dockerfile: Dockerfile
    container_name: jobbingtrack-workflow-service-prod
    environment:
      - NODE_ENV=production
      - PORT=3013
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobbingtrack}:${POSTGRES_PASSWORD}@jobbingtrack-postgres-prod:5432/${POSTGRES_DB:-jobbingtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://jobbingtrack-auth-service-prod:3001
      - APPLICATION_SERVICE_URL=http://jobbingtrack-application-service-prod:3002
      - FOLLOWUP_SERVICE_URL=http://jobbingtrack-followup-service-prod:3012
      - NOTIFICATION_SERVICE_URL=http://jobbingtrack-notification-service-prod:3006
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND
  # ============================================================================

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: jobbingtrack-frontend-prod
    environment:
      - NODE_ENV=production
      # ✅ UTILISER LE NOM DU CONTENEUR API GATEWAY
      - NEXT_PUBLIC_API_URL=http://jobbingtrack-api-gateway-prod:3000
      - NEXT_PUBLIC_APP_NAME=JobbingTrack
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      - api-gateway
    networks:
      - jobbingtrack-network
    restart: unless-stopped
    labels:
      # ✅ Configuration pour Nginx Proxy Manager
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-jobbingtrack.votredomaine.com}`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
    driver: local

networks:
  jobbingtrack-network:
    driver: bridge
    name: jobbingtrack-prod-network

