# Résolution DNS Docker (127.0.0.11) + proxy_pass sur variable : après `docker compose up
# --force-recreate`, le conteneur `frontend` change d’IP ; sans cela Nginx garde l’ancienne
# résolution → 502 Bad Gateway jusqu’au redémarrage manuel du proxy.

# HTTP → HTTPS (ports hôte 80 → conteneur 80). En dev : 443 et 5443 mappés tous deux sur TLS Nginx.
server {
    listen 80;
    server_name jobbingtrack.localhost localhost;
    return 308 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.jobbingtrack.localhost;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jobbingtrack.localhost localhost;

    ssl_certificate /etc/nginx/certs/jobbingtrack-dev-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/jobbingtrack-dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 320m;

    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    error_page 502 /__jt_err__/502.html;
    error_page 503 /__jt_err__/503.html;
    error_page 504 /__jt_err__/504.html;

    location ^~ /__jt_err__/ {
        internal;
        default_type text/html;
        charset utf-8;
        alias /etc/nginx/__jt_err__/;
    }

    # Alias anti-adblock (uBlock) — même cible que metrics-aggregator côté Next.js.
    location ^~ /api/mon/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /api/persist/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy Next.js metrics-aggregator (route App Router frontend) — avant /api/ gateway.
    # Sans ce bloc, /api/metrics-aggregator/* part vers api-gateway → 404 et graphes Performances vides.
    location ^~ /api/metrics-aggregator/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Routes App Router Next.js utilisées par le backoffice Tests/Rapports.
    # Elles doivent rester côté frontend ; sinon /api/* part vers api-gateway et renvoie 404.
    location ^~ /api/test-reports/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/test/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/security/cve- {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Build APK / ADB — routes App Router Next.js (proxy vers contrôleur hôte).
    # Sans ce bloc, /api/emulator-proxy/* → api-gateway → 404.
    location ^~ /api/emulator-proxy/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /api/emulator-proxy/install-run {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /api/emulator-proxy/install-apk-device {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Pilotage board / fichiers md — routes App Router Next.js (pas api-gateway).
    # Sans ce bloc : GET /api/pilotage/* → gateway → 404 « Route non trouvée ».
    location ^~ /api/pilotage/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    # Upload APK OTA (~200 Mo) — timeouts longs + limite corps explicite
    location ^~ /api/v1/admin/mobile/releases/upload {
        client_max_body_size 320m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_gateway api-gateway:3000;
        proxy_pass http://$jt_upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location ^~ /api/v1/admin/mobile/releases/publish-built {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_gateway api-gateway:3000;
        proxy_pass http://$jt_upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Accès dev depuis un appareil du LAN (ex. https://192.168.x.x:5443) :
    # le navigateur mobile ne résout pas api.jobbingtrack.localhost, donc les
    # appels API peuvent rester same-origin via /api/*.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_gateway api-gateway:3000;
        proxy_pass http://$jt_upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.jobbingtrack.localhost;

    ssl_certificate /etc/nginx/certs/jobbingtrack-dev-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/jobbingtrack-dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
