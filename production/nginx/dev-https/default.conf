# Résolution DNS Docker (127.0.0.11) + proxy_pass sur variable : après `docker compose up
# --force-recreate`, le conteneur `frontend` change d’IP ; sans cela Nginx garde l’ancienne
# résolution → 502 Bad Gateway jusqu’au redémarrage manuel du proxy.

server {
    listen 443 ssl;
    http2 on;
    server_name jobbingtrack.localhost localhost;

    ssl_certificate /etc/nginx/certs/jobbingtrack-dev-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/jobbingtrack-dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 16m;

    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    error_page 502 /__jt_err__/502.html;
    error_page 503 /__jt_err__/503.html;
    error_page 504 /__jt_err__/504.html;

    location ^~ /__jt_err__/ {
        internal;
        default_type text/html;
        charset utf-8;
        alias /etc/nginx/__jt_err__/;
    }

    # Proxy Next.js metrics-aggregator (route App Router frontend) — avant /api/ gateway.
    # Sans ce bloc, /api/metrics-aggregator/* part vers api-gateway → 404 et graphes Performances vides.
    location ^~ /api/metrics-aggregator/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Accès dev depuis un appareil du LAN (ex. https://192.168.x.x:5443) :
    # le navigateur mobile ne résout pas api.jobbingtrack.localhost, donc les
    # appels API peuvent rester same-origin via /api/*.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_gateway api-gateway:3000;
        proxy_pass http://$jt_upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jt_upstream_frontend frontend:3000;
        proxy_pass http://$jt_upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

