# ============================================================================
# Règles WAF (Web Application Firewall) pour JobbingTrack
# ============================================================================
# Basé sur les règles OWASP et les meilleures pratiques de sécurité

# Règles de base pour détecter les attaques courantes
waf_rule "SQL_INJECTION" {
    pattern: "(?i)(union|select|insert|update|delete|drop|create|alter|exec|execute|declare|cast|set|declare|xp_|sp_)";
    score: 50;
    action: DENY;
    description: "Détection d'injection SQL";
}

waf_rule "XSS_ATTACK" {
    pattern: "(?i)(<script|javascript:|onload=|onerror=|onclick=|onsubmit=|onreset=|onfocus=|onblur=|onchange=|onmouseover=|onmouseout=|onkeydown=|onkeyup=|onkeypress=)";
    score: 50;
    action: DENY;
    description: "Détection d'attaque XSS";
}

waf_rule "PATH_TRAVERSAL" {
    pattern: "(?i)(\.\.\/|\.\.\\\\|\.\.%2f|\.\.%5c|%252e%252e%252f|%c0%ae%c0%ae%c0%af)";
    score: 100;
    action: DENY;
    description: "Détection de path traversal";
}

waf_rule "COMMAND_INJECTION" {
    pattern: "(?i)([;&|`$\(\){}<>\\\\]|rm\s|del\s|format\s|shutdown\s|wget\s|curl\s|nc\s|netcat\s|telnet\s|ssh\s)";
    score: 100;
    action: DENY;
    description: "Détection d'injection de commandes";
}

waf_rule "LDAP_INJECTION" {
    pattern: "(?i)(\*|\(|\)|&|\||\w+\s*[\=\<\>]\s*\w+)";
    score: 30;
    action: DENY;
    description: "Détection d'injection LDAP";
}

# Règles pour détecter les outils d'attaque
waf_rule "MALICIOUS_USER_AGENTS" {
    pattern: "(?i)(sqlmap|nikto|nessus|openvas|nmap|masscan|dirbuster|gobuster|wpscan|joomlavs|w3af|skipfish|owasp|burpsuite|acunetix|havij|beef|metasploit)";
    score: 20;
    action: LOG;
    description: "Détection d'outils de sécurité/attaque";
}

# Règles pour les patterns malveillants
waf_rule "MALICIOUS_PATTERNS" {
    pattern: "(?i)(eval\s*\(|base64_decode\s*\(|str_rot13\s*\(|gzinflate\s*\(|gzuncompress\s*\(|strrev\s*\(|system\s*\(|shell_exec\s*\(|exec\s*\(|passthru\s*\(|proc_open\s*\(|popen\s*\()";
    score: 100;
    action: DENY;
    description: "Détection de fonctions PHP malveillantes";
}

# Règles pour les headers suspects
waf_rule "SUSPICIOUS_HEADERS" {
    pattern: "(?i)(x-forwarded-for|x-real-ip|x-client-ip|x-originating-ip):\s*[^,\s]+,\s*[^,\s]+";
    score: 15;
    action: LOG;
    description: "Détection de headers suspects";
}

# Règles pour les méthodes HTTP dangereuses
waf_rule "DANGEROUS_METHODS" {
    pattern: "(?i)^(TRACE|TRACK|OPTIONS)$";
    score: 25;
    action: DENY;
    description: "Méthodes HTTP potentiellement dangereuses";
}

# Règles pour les tentatives de LFI/RFI
waf_rule "FILE_INCLUSION" {
    pattern: "(?i)(file|http|https|ftp|php)://";
    score: 40;
    action: DENY;
    description: "Détection d'inclusion de fichiers";
}

# Règles pour les uploads malveillants
waf_rule "MALICIOUS_UPLOADS" {
    pattern: "(?i)(\.php|\.jsp|\.asp|\.exe|\.bat|\.cmd|\.com|\.pif|\.scr|\.vbs|\.js|\.jar|\.sh)$";
    score: 35;
    action: DENY;
    description: "Détection d'extensions de fichiers malveillants";
}

# Règles pour les attaques par déni de service
waf_rule "DOS_PATTERNS" {
    pattern: "(.)\1{100,}";
    score: 10;
    action: LOG;
    description: "Détection de patterns répétés (DoS potentiel)";
}

# Configuration générale du WAF
waf_mode LOG_AND_BLOCK;
waf_log_level warn;
waf_log_file /var/log/nginx/waf.log;
waf_block_page /403.html;

# Seuils de score pour différentes actions
waf_score_threshold {
    LOG: 10;
    BLOCK: 50;
    BAN: 100;
}

# Liste blanche (si nécessaire)
waf_allow_ips {
    # Ajouter les IPs de confiance ici
    # 10.0.0.1;
    # 192.168.1.100;
}

# Liste noire (pour bloquer définitivement)
waf_deny_ips {
    # Ajouter les IPs malveillantes ici
    # 192.168.1.200;
    # 10.0.0.50;
}

# Configuration des logs détaillés
waf_log_format "%{time} %{remote_addr} %{request_method} %{request_uri} %{server_protocol} %{status} %{body_bytes_sent} %{http_user_agent} %{http_referer} %{waf_rule} %{waf_score}";
