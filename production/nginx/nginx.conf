# ============================================================================
# Configuration Nginx Sécurisée - JobbingTrack
# ============================================================================
# Cette configuration inclut WAF, rate limiting et sécurité renforcée

user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;

# Configuration des logs
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Configuration des événements
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# ============================================================================
# MODULES DE SÉCURITÉ
# ============================================================================

# Chargement des modules de sécurité
load_module modules/ngx_http_waf_module.so;

# ============================================================================
# CONFIGURATION HTTP PRINCIPALE
# ============================================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ============================================================================
    # LOGGING ET MONITORING
    # ============================================================================

    # Format de log personnalisé avec informations de sécurité
    log_format security_log '[$time_local] $remote_addr - $remote_user - $server_name '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time" '
                           'waf="$http_x_waf_status" '
                           'rl="$http_x_ratelimit_limit:$http_x_ratelimit_remaining"';

    access_log /var/log/nginx/access.log security_log;

    # ============================================================================
    # CONFIGURATIONS DE BASE
    # ============================================================================

    # Optimisations de performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Tailles des buffers
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ============================================================================
    # SÉCURITÉ DE BASE
    # ============================================================================

    # Désactivation des méthodes HTTP dangereuses
    map $request_method $not_allowed_method {
        default 0;
        "~^(TRACE|TRACK|OPTIONS)$" 1;
    }

    # Headers de sécurité
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # ============================================================================
    # RATE LIMITING AVANCÉ
    # ============================================================================

    # Zones de rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=bulk:10m rate=10r/s;

    # Burst configuration pour gérer les pics
    limit_req_zone $binary_remote_addr zone=api_burst:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_burst:10m rate=2r/s;

    # ============================================================================
    # WAF (Web Application Firewall) - RÈGLES OWASP
    # ============================================================================

    # Règles WAF principales
    waf_rule_path /etc/nginx/waf/rules.conf;
    waf_mode LOG_AND_BLOCK;

    # Règles personnalisées pour JobbingTrack
    waf_check_sql_injection on;
    waf_check_xss on;
    waf_check_path_traversal on;
    waf_check_command_injection on;
    waf_check_ldap_injection on;
    waf_check_suspicious_ua on;
    waf_check_malicious_patterns on;

    # Liste noire d'IPs (à configurer)
    waf_deny_ips /etc/nginx/waf/blacklist.conf;

    # Liste blanche d'IPs (pour les admins)
    waf_allow_ips /etc/nginx/waf/whitelist.conf;

    # ============================================================================
    # UPSTREAM SERVERS
    # ============================================================================

    # API Gateway
    upstream api_gateway {
        server api-gateway:3000 fail_timeout=0;
        keepalive 32;
    }

    # Frontend
    upstream frontend {
        server frontend:3000 fail_timeout=0;
        keepalive 16;
    }

    # ============================================================================
    # SERVEUR VIRTUEL PRINCIPAL
    # ============================================================================

    server {
        listen 80;
        server_name _;

        # Redirection HTTP vers HTTPS
        return 301 https://$server_name$request_uri;
    }

    # ============================================================================
    # SERVEUR VIRTUEL HTTPS
    # ============================================================================

    server {
        listen 443 ssl http2;
        server_name api.votredomaine.com;

        # ============================================================================
        # CONFIGURATION SSL
        # ============================================================================

        # Chemins des certificats (à adapter selon votre configuration)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Configuration SSL sécurisée
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # ============================================================================
        # SÉCURITÉ WAF ET RATE LIMITING
        # ============================================================================

        # Application du WAF
        waf on;

        # Rate limiting général pour l'API
        limit_req zone=api burst=20 nodelay;

        # Headers de sécurité supplémentaires
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Expect-CT "max-age=86400, enforce" always;

        # ============================================================================
        # ROUTES API GATEWAY
        # ============================================================================

        # Route principale de l'API
        location / {
            # Rate limiting spécifique
            limit_req zone=api burst=10 nodelay;

            # Proxy vers l'API Gateway
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer sizes
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ============================================================================
        # ROUTES SPÉCIALISÉES
        # ============================================================================

        # Route d'authentification (rate limiting strict)
        location /api/v1/auth/ {
            limit_req zone=auth burst=2 nodelay;

            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routes d'administration (accès restreint)
        location /api/v1/admin/ {
            limit_req zone=admin burst=5 nodelay;

            # Vérification d'IP autorisée (si nécessaire)
            # allow 192.168.1.0/24;
            # deny all;

            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routes de bulk operations (opérations massives)
        location ~ ^/api/v1/.*/bulk {
            limit_req zone=bulk burst=3 nodelay;

            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================================
        # BLOQUER LES ACCÈS NON AUTORISÉS
        # ============================================================================

        # Bloquer l'accès aux fichiers sensibles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Bloquer l'accès aux fichiers de sauvegarde
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Bloquer les requêtes vers des fichiers PHP (si présents)
        location ~ \.php$ {
            deny all;
            return 403;
        }

        # ============================================================================
        # GESTION DES ERREURS
        # ============================================================================

        # Page d'erreur personnalisée pour les blocages WAF
        error_page 403 /403.html;
        location = /403.html {
            internal;
            root /usr/share/nginx/html;
            allow all;
        }

        # Page d'erreur pour rate limiting
        error_page 429 /429.html;
        location = /429.html {
            internal;
            root /usr/share/nginx/html;
            add_header Retry-After $http_x_ratelimit_reset always;
        }
    }

    # ============================================================================
    # SERVEUR VIRTUEL FRONTEND (HTTPS)
    # ============================================================================

    server {
        listen 443 ssl http2;
        server_name jobbingtrack.votredomaine.com;

        # Configuration SSL (même que ci-dessus)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Headers de sécurité pour le frontend
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # WAF pour le frontend
        waf on;

        # Rate limiting plus permissif pour le frontend
        limit_req zone=api burst=50 nodelay;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts plus courts pour le frontend
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Assets statiques avec cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ============================================================================
    # CONFIGURATION DU MONITORING
    # ============================================================================

    # Serveur pour les métriques de sécurité
    server {
        listen 443 ssl;
        server_name monitoring.votredomaine.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

        # Accès restreint au monitoring
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location /metrics {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}

# ============================================================================
# CONFIGURATION ADDITIONNELLE POUR LES STREAMS
# ============================================================================

stream {
    # Configuration pour les connexions TCP si nécessaire
    server {
        listen 5432;
        proxy_pass postgres:5432;
        proxy_timeout 60s;
    }
}
