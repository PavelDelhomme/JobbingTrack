# Fichier additionnel pour le legacy C (profil monitoring-c uniquement).
# Le parcours par défaut (full / monitoring) utilise monitoring-agent-rs + log-collector-rs
# définis dans docker-compose.yml.

networks:
  jobbingtrack-network:
    external: true
    name: jobbingtrack_jobbingtrack-network
    # Utiliser le même réseau que docker-compose.yml principal

services:
  # Collecteur de logs C legacy — uniquement avec `make monitoring-c-up` / profil monitoring-c.
  log-collector-c:
    build:
      context: ./monitoring/log-collector-c
      dockerfile: Dockerfile
    container_name: jobbingtrack-log-collector-c
    user: "0:0"
    ports:
      # Hôte legacy (5109 par défaut) → port interne 3019.
      - "${LOG_COLLECTOR_C_LEGACY_PORT:-5109}:${LOG_COLLECTOR_C_INTERNAL_PORT:-3019}"
    command: ["./log-collector-c", "${LOG_COLLECTOR_C_INTERNAL_PORT:-3019}"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - LOG_COLLECTOR_READ_EXISTING=${LOG_COLLECTOR_READ_EXISTING:-0}
      - POSTGRES_DB=${POSTGRES_DB:-jobbingtrack}
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jobbingtrack123}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-jobbingtrack}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "log-collector-c"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - monitoring-c
