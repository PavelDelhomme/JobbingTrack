# Configuration pour le nouveau système de monitoring en C
# Remplace progressivement metrics-aggregator-service et Loki

networks:
  jobbingtrack-network:
    external: true
    name: jobbingtrack_jobbingtrack-network
    # Utiliser le même réseau que docker-compose.yml principal

services:
  # Nouveau système de monitoring en C (ultra-léger)
  monitoring-c:
    build:
      context: ./monitoring-c
      dockerfile: Dockerfile
    container_name: jobbingtrack-monitoring-c
    user: "0:0"
    ports:
      - "5098:8015"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - COLLECTION_INTERVAL=${METRICS_COLLECTION_INTERVAL:-15}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-jobbingtrack}
      - POSTGRES_USER=${POSTGRES_USER:-jobbingtrack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jobbingtrack123}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "monitoring-c"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - monitoring-c
      - full

  # Nouveau système de collecte de logs en C (remplace Loki)
  log-collector-c:
    build:
      context: ./log-collector-c
      dockerfile: Dockerfile
    container_name: jobbingtrack-log-collector-c
    user: "0:0"
    ports:
      - "${LOG_COLLECTOR_C_PORT:-5099}:${LOG_COLLECTOR_C_INTERNAL_PORT:-8016}"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - jobbingtrack-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "log-collector-c"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Note: depends_on retiré car PostgreSQL est déjà démarré avant dans le Makefile
    # et cela évite la recréation du conteneur PostgreSQL
    profiles:
      - monitoring-c
      - full

